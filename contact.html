<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · Jeffrey Yeung</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #050816;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
    }

    .page-shell {
      flex: 1;
      padding: 24px min(8vw, 80px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      text-decoration: none;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
      font-size: 18px;
      transition: background 0.2s ease-out, transform 0.15s ease-out,
        border-color 0.2s ease-out;
    }

    .back-link:hover {
      background: rgba(31, 41, 55, 0.95);
      border-color: rgba(129, 140, 248, 0.9);
      transform: translateX(-1px);
    }

    .back-link:active {
      transform: translateX(0);
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .page-subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .content {
      max-width: 760px;
      padding-top: 8px;
      line-height: 1.7;
      color: #d1d5db;
      font-size: 0.98rem;
    }

    .contact-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
    }

    .contact-item a {
      color: #38bdf8;
      text-decoration: none;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #9ca3af;
      margin-bottom: 2px;
    }

    @media (max-width: 640px) {
      .page-shell {
        padding: 20px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="top-bar">
      <a class="back-link" href="index.html" aria-label="Back to home">
        ←
      </a>
      <div>
        <div class="page-title">Contact</div>
        <div class="page-subtitle">How to reach me.</div>
      </div>
    </header>

    <main class="content">
      <p>
        Replace the placeholders below with your actual contact details – email,
        social links, or anything else you’re comfortable sharing.
      </p>

      <ul class="contact-list">
        <li class="contact-item">
          <div class="label">Email</div>
          <a href="mailto:you@example.com">you@example.com</a>
        </li>
        <li class="contact-item">
          <div class="label">GitHub</div>
          <a href="https://github.com/Jyosnorkel" target="_blank" rel="noreferrer">
            github.com/Jyosnorkel
          </a>
        </li>
        <li class="contact-item">
          <div class="label">LinkedIn</div>
          <a href="#" target="_blank" rel="noreferrer">
            Add your LinkedIn URL here
          </a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
