<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPQ Paper · Jeffrey Yeung</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #050816;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px min(8vw, 80px);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 55%),
        rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid rgba(55, 65, 81, 0.9);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      text-decoration: none;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
      font-size: 18px;
      transition: background 0.2s ease-out, transform 0.15s ease-out,
        border-color 0.2s ease-out;
    }

    .back-link:hover {
      background: rgba(31, 41, 55, 0.95);
      border-color: rgba(129, 140, 248, 0.9);
      transform: translateX(-1px);
    }

    .back-link:active {
      transform: translateX(0);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .page-subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .viewer-shell {
      flex: 1;
      padding: 12px min(8vw, 80px) 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .viewer-frame {
      flex: 1;
      border-radius: 14px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #020617;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #020617;
    }

    .fallback {
      padding: 12px;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .fallback a {
      color: #38bdf8;
      text-decoration: none;
    }

    .fallback a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .top-bar {
        padding: 12px 16px;
      }

      .viewer-shell {
        padding: 10px 16px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a class="back-link" href="../projects.html" aria-label="Back to projects">
      ←
    </a>
    <div>
      <div class="page-title">EPQ Paper</div>
      <div class="page-subtitle">Embedded PDF viewer (scroll to read).</div>
    </div>
  </header>

  <main class="viewer-shell">
    <div class="viewer-frame">
      <iframe src="epq-paper.pdf">
        <!-- Fallback content if iframe/PDF can't load -->
        <div class="fallback">
          Your browser can’t display the PDF here.
          <a href="epq-paper.pdf" target="_blank" rel="noreferrer">
            Open the EPQ paper in a new tab
          </a>.
        </div>
      </iframe>
    </div>
  </main>
</body>
</html>
